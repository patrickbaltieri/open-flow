[package]
name = "app"
version = "0.1.15"
description = "Open Flow — ditado inteligente para Windows e macOS"
authors = ["Macks Wendhell"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
arboard = "3"
enigo = "0.6"
dirs = "6"
# Sign in with ChatGPT: PKCE S256, aleatoriedade do sistema e base64url.
# As tres ja estavam na arvore por outras dependencias; aqui so viram diretas.
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
objc2 = "0.6"
